[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-play-recommender"
version = "0.1.0"
description = "Pause-and-analyze NBA play recommender. Phase 1: reasoning layer on perfect tracking."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "polars",
    "pyarrow",
    "matplotlib",
    # Phase 2 value model. For GPU training install a CUDA build of torch, e.g.
    #   pip install torch --index-url https://download.pytorch.org/whl/cu126
    "lightgbm",
    "torch",
    "scikit-learn",
]

[project.optional-dependencies]
# Phase 3 (perception) — not needed for the Phases 1-2 reasoning + value layers.
perception = ["ultralytics", "supervision", "opencv-python", "transformers"]
dev = ["pytest"]

[project.scripts]
nba-phase1-demo = "scripts.demo_phase1:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
