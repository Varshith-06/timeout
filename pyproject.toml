[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-play-recommender"
version = "0.1.0"
description = "Pause-and-analyze NBA play recommender. Phase 1: reasoning layer on perfect tracking."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "polars",
    "pyarrow",
    "matplotlib",
    # Phase 2 value model. For GPU training install a CUDA build of torch, e.g.
    #   pip install torch --index-url https://download.pytorch.org/whl/cu126
    "lightgbm",
    "torch",
    "scikit-learn",
    # Phase 3 perception spine: homography (cv2) + team clustering (sklearn).
    "opencv-python-headless",
]

[project.optional-dependencies]
# Phase 3 learned front-end (needs annotated frames): real detection, court
# keypoints, jersey OCR, pose. The perception spine runs without these on the
# synthetic broadcast; plug them in for real video.
perception-models = ["ultralytics", "supervision", "transformers", "paddleocr"]
# Phase 5.4 live rationale via Claude. The offline template generator (the
# default) needs nothing extra; install this only for --use-claude.
llm = ["anthropic"]
# Real broadcast video: clip fetcher (nba_api) + pretrained detection (YOLO).
realvideo = ["nba_api", "ultralytics"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
